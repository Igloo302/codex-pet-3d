<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <title>Codex Pet 3D — Inspector</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b14;
        --surface: rgba(17, 24, 39, 0.72);
        --surface-solid: #111827;
        --border: rgba(148, 163, 184, 0.16);
        --border-strong: rgba(148, 163, 184, 0.32);
        --text: #e6edf7;
        --muted: #8b9bb4;
        --accent: #4cc9f0;
        --accent-2: #a78bfa;
        --success: #34d399;
        --danger: #fb7185;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        background:
          radial-gradient(900px 600px at 12% -10%, rgba(76, 201, 240, 0.16), transparent 60%),
          radial-gradient(800px 600px at 100% 0%, rgba(167, 139, 250, 0.16), transparent 55%),
          radial-gradient(700px 500px at 50% 110%, rgba(52, 211, 153, 0.08), transparent 60%),
          var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      .app {
        max-width: 1440px;
        margin: 0 auto;
        padding: 28px clamp(16px, 3vw, 36px) 24px;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 20px;
        min-height: 100vh;
      }

      /* ---------- Header ---------- */
      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 18px;
        letter-spacing: -0.04em;
        color: #06121c;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 10px 30px rgba(76, 201, 240, 0.28);
      }

      .brand-title {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .brand-sub {
        margin: 3px 0 0;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .header-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        font-size: 12px;
        color: var(--muted);
        backdrop-filter: blur(12px);
      }

      .chip strong {
        color: var(--text);
        font-weight: 600;
      }

      .live-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.14);
      }

      /* ---------- Workspace ---------- */
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 20px;
        min-height: 0;
      }

      .viewport-card {
        position: relative;
        min-height: 520px;
        border: 1px solid var(--border);
        border-radius: 22px;
        overflow: hidden;
        background:
          radial-gradient(70% 60% at 50% 42%, rgba(76, 201, 240, 0.09), transparent 70%),
          linear-gradient(180deg, rgba(19, 28, 46, 0.9), rgba(8, 13, 24, 0.96));
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .viewport-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.055) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(70% 70% at 50% 50%, #000, transparent);
        pointer-events: none;
      }

      .canvas-wrap {
        position: absolute;
        inset: 0;
      }

      .pet-canvas {
        display: block;
        outline: none;
      }

      .viewport-badge {
        position: absolute;
        top: 18px;
        left: 18px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        background: rgba(7, 11, 20, 0.72);
        border: 1px solid var(--border);
        border-radius: 999px;
        backdrop-filter: blur(10px);
        pointer-events: none;
      }

      .viewport-badge .live-dot {
        width: 6px;
        height: 6px;
      }

      .viewport-hint {
        position: absolute;
        bottom: 18px;
        left: 18px;
        font-size: 12px;
        color: var(--muted);
        background: rgba(7, 11, 20, 0.72);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 12px;
        backdrop-filter: blur(10px);
        pointer-events: none;
      }

      .viewport-hint kbd {
        font-family: inherit;
        color: var(--accent);
        font-weight: 600;
      }

      /* ---------- Side panel ---------- */
      .side-panel {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }

      .panel-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
        backdrop-filter: blur(14px);
      }

      .panel-title {
        margin: 0 0 4px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text);
      }

      .panel-desc {
        margin: 0 0 14px;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
      }

      .dropzone {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
        padding: 26px 16px;
        border: 1.5px dashed var(--border-strong);
        border-radius: 14px;
        background: rgba(9, 14, 26, 0.5);
        transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
        cursor: pointer;
      }

      .dropzone.is-dragging {
        border-color: var(--accent);
        background: rgba(76, 201, 240, 0.12);
        transform: translateY(-2px);
      }

      .dropzone-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(76, 201, 240, 0.22), rgba(167, 139, 250, 0.22));
        border: 1px solid rgba(76, 201, 240, 0.3);
        color: var(--accent);
        font-size: 20px;
        line-height: 1;
      }

      .dropzone-title {
        font-size: 13px;
        font-weight: 600;
      }

      .dropzone-sub {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.5;
      }

      .file-input {
        display: none;
      }

      .browse-btn {
        margin-top: 4px;
        padding: 8px 14px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        color: #06121c;
        background: linear-gradient(135deg, var(--accent), #7dd3fc);
        border: 0;
        border-radius: 9px;
        cursor: pointer;
        transition: filter 0.15s ease;
      }

      .browse-btn:hover {
        filter: brightness(1.1);
      }

      .reset-btn {
        width: 100%;
        margin-top: 12px;
        padding: 9px 12px;
        font: inherit;
        font-size: 12px;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 9px;
        cursor: pointer;
        transition: color 0.15s ease, border-color 0.15s ease;
      }

      .reset-btn:hover:not(:disabled) {
        color: var(--text);
        border-color: var(--border-strong);
      }

      .reset-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .status-line {
        margin-top: 12px;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      .status-line.is-error {
        color: var(--danger);
      }

      .status-line strong {
        color: var(--text);
        font-weight: 600;
      }

      .info-grid {
        display: grid;
        gap: 10px;
      }

      .info-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.08);
      }

      .info-row:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .info-key {
        color: var(--muted);
        flex-shrink: 0;
      }

      .info-val {
        color: var(--text);
        font-weight: 600;
        text-align: right;
        overflow-wrap: anywhere;
      }

      /* ---------- Action bar ---------- */
      .action-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
        padding: 16px 18px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        backdrop-filter: blur(14px);
      }

      .action-bar-head {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .action-bar-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .action-bar-sub {
        font-size: 11px;
        color: var(--muted);
      }

      .action-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .action-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        background: rgba(9, 14, 26, 0.6);
        border: 1px solid var(--border);
        border-radius: 10px;
        cursor: pointer;
        transition: color 0.16s ease, border-color 0.16s ease, background 0.16s ease,
          transform 0.16s ease;
      }

      .action-btn:hover {
        color: var(--text);
        border-color: var(--border-strong);
        transform: translateY(-1px);
      }

      .action-btn.active {
        color: #06121c;
        background: linear-gradient(135deg, var(--accent), #7dd3fc);
        border-color: transparent;
        box-shadow: 0 8px 22px rgba(76, 201, 240, 0.24);
      }

      .action-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.55;
      }

      .action-btn.active .action-dot {
        opacity: 1;
      }

      @media (max-width: 980px) {
        .workspace {
          grid-template-columns: minmax(0, 1fr);
        }

        .viewport-card {
          min-height: 420px;
        }

        .side-panel {
          flex-direction: row;
          flex-wrap: wrap;
        }

        .side-panel .panel-card {
          flex: 1 1 260px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
