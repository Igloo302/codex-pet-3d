<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <title>Codex Pet 3D — Authoring Studio</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b14;
        --surface: rgba(17, 24, 39, 0.72);
        --surface-solid: #111827;
        --border: rgba(148, 163, 184, 0.16);
        --border-strong: rgba(148, 163, 184, 0.32);
        --text: #e6edf7;
        --muted: #8b9bb4;
        --accent: #4cc9f0;
        --accent-2: #a78bfa;
        --success: #34d399;
        --danger: #fb7185;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        background:
          radial-gradient(900px 600px at 12% -10%, rgba(76, 201, 240, 0.16), transparent 60%),
          radial-gradient(800px 600px at 100% 0%, rgba(167, 139, 250, 0.16), transparent 55%),
          radial-gradient(700px 500px at 50% 110%, rgba(52, 211, 153, 0.08), transparent 60%),
          var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      .app {
        max-width: 1440px;
        margin: 0 auto;
        padding: 28px clamp(16px, 3vw, 36px) 24px;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 20px;
        min-height: 100vh;
      }

      /* ---------- Header ---------- */
      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 18px;
        letter-spacing: -0.04em;
        color: #06121c;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 10px 30px rgba(76, 201, 240, 0.28);
      }

      .brand-title {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .brand-sub {
        margin: 3px 0 0;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .header-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        font-size: 12px;
        color: var(--muted);
        backdrop-filter: blur(12px);
      }

      .chip strong {
        color: var(--text);
        font-weight: 600;
      }

      .live-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.14);
      }

      /* ---------- Workspace ---------- */
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 370px;
        gap: 20px;
        min-height: 0;
      }

      .viewport-card {
        position: relative;
        min-height: 520px;
        border: 1px solid var(--border);
        border-radius: 22px;
        overflow: hidden;
        background:
          radial-gradient(70% 60% at 50% 42%, rgba(76, 201, 240, 0.09), transparent 70%),
          linear-gradient(180deg, rgba(19, 28, 46, 0.9), rgba(8, 13, 24, 0.96));
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .viewport-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.055) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(70% 70% at 50% 50%, #000, transparent);
        pointer-events: none;
      }

      .canvas-wrap {
        position: absolute;
        inset: 0;
      }

      .pet-canvas {
        display: block;
        outline: none;
      }

      .viewport-badge {
        position: absolute;
        top: 18px;
        left: 18px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        background: rgba(7, 11, 20, 0.72);
        border: 1px solid var(--border);
        border-radius: 999px;
        backdrop-filter: blur(10px);
        pointer-events: none;
      }

      .viewport-badge .live-dot {
        width: 6px;
        height: 6px;
      }

      .viewport-hint {
        position: absolute;
        bottom: 18px;
        left: 18px;
        font-size: 12px;
        color: var(--muted);
        background: rgba(7, 11, 20, 0.72);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 12px;
        backdrop-filter: blur(10px);
        pointer-events: none;
      }

      .viewport-hint kbd {
        font-family: inherit;
        color: var(--accent);
        font-weight: 600;
      }

      /* ---------- Side panel ---------- */
      .side-panel {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }

      .panel-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
        backdrop-filter: blur(14px);
      }

      .panel-title {
        margin: 0 0 4px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text);
      }

      .panel-desc {
        margin: 0 0 14px;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
      }

      .dropzone {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
        padding: 26px 16px;
        border: 1.5px dashed var(--border-strong);
        border-radius: 14px;
        background: rgba(9, 14, 26, 0.5);
        transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
        cursor: pointer;
      }

      .dropzone.is-dragging {
        border-color: var(--accent);
        background: rgba(76, 201, 240, 0.12);
        transform: translateY(-2px);
      }

      .dropzone-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(76, 201, 240, 0.22), rgba(167, 139, 250, 0.22));
        border: 1px solid rgba(76, 201, 240, 0.3);
        color: var(--accent);
        font-size: 20px;
        line-height: 1;
      }

      .dropzone-title {
        font-size: 13px;
        font-weight: 600;
      }

      .dropzone-sub {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.5;
      }

      .file-input {
        display: none;
      }

      .browse-btn {
        margin-top: 4px;
        padding: 8px 14px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        color: #06121c;
        background: linear-gradient(135deg, var(--accent), #7dd3fc);
        border: 0;
        border-radius: 9px;
        cursor: pointer;
        transition: filter 0.15s ease;
      }

      .browse-btn:hover {
        filter: brightness(1.1);
      }

      .reset-btn {
        width: 100%;
        margin-top: 12px;
        padding: 9px 12px;
        font: inherit;
        font-size: 12px;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 9px;
        cursor: pointer;
        transition: color 0.15s ease, border-color 0.15s ease;
      }

      .reset-btn:hover:not(:disabled) {
        color: var(--text);
        border-color: var(--border-strong);
      }

      .reset-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .status-line {
        margin-top: 12px;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      .status-line.is-error {
        color: var(--danger);
      }

      .status-line strong {
        color: var(--text);
        font-weight: 600;
      }

      .info-grid {
        display: grid;
        gap: 10px;
      }

      .info-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.08);
      }

      .info-row:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .info-key {
        color: var(--muted);
        flex-shrink: 0;
      }

      .info-val {
        color: var(--text);
        font-weight: 600;
        text-align: right;
        overflow-wrap: anywhere;
      }

      /* ---------- Action bar ---------- */
      .action-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
        padding: 16px 18px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        backdrop-filter: blur(14px);
      }

      .action-bar-head {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .action-bar-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .action-bar-sub {
        font-size: 11px;
        color: var(--muted);
      }

      .action-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .action-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        background: rgba(9, 14, 26, 0.6);
        border: 1px solid var(--border);
        border-radius: 10px;
        cursor: pointer;
        transition: color 0.16s ease, border-color 0.16s ease, background 0.16s ease,
          transform 0.16s ease;
      }

      .action-btn:hover {
        color: var(--text);
        border-color: var(--border-strong);
        transform: translateY(-1px);
      }

      .action-btn.active {
        color: #06121c;
        background: linear-gradient(135deg, var(--accent), #7dd3fc);
        border-color: transparent;
        box-shadow: 0 8px 22px rgba(76, 201, 240, 0.24);
      }

      .action-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.55;
      }

      .action-btn.active .action-dot {
        opacity: 1;
      }

      @media (max-width: 980px) {
        .workspace {
          grid-template-columns: minmax(0, 1fr);
        }

        .viewport-card {
          min-height: 420px;
        }

        .side-panel {
          flex-direction: column;
        }
      }

      /* ---------- Studio Authoring Controls ---------- */
      .chip-pass {
        border-color: rgba(52, 211, 153, 0.35);
        color: var(--success);
      }

      .chip-fail {
        border-color: rgba(251, 113, 133, 0.4);
        color: var(--danger);
      }

      .mode-toggle {
        position: absolute;
        top: 18px;
        right: 18px;
        display: inline-flex;
        padding: 3px;
        background: rgba(7, 11, 20, 0.78);
        border: 1px solid var(--border);
        border-radius: 999px;
        backdrop-filter: blur(10px);
        gap: 2px;
      }

      .mode-btn {
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        padding: 6px 11px;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .mode-btn.active {
        background: linear-gradient(135deg, var(--accent), #7dd3fc);
        color: #06121c;
      }

      .studio-tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: 5px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
      }

      .studio-tab {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 10px;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .studio-tab.active {
        background: rgba(76, 201, 240, 0.16);
        color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(76, 201, 240, 0.35);
      }

      .pill-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }

      .pill-dot.pass {
        background: var(--success);
      }

      .pill-dot.fail {
        background: var(--danger);
      }

      .panel-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }

      .panel-title-row .panel-title {
        margin: 0;
      }

      .status-badge {
        font-size: 11px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 999px;
      }

      .status-badge.pass {
        color: var(--success);
        background: rgba(52, 211, 153, 0.14);
        border: 1px solid rgba(52, 211, 153, 0.3);
      }

      .status-badge.fail {
        color: var(--danger);
        background: rgba(251, 113, 133, 0.14);
        border: 1px solid rgba(251, 113, 133, 0.3);
      }

      .budget-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .budget-item {
        padding: 10px;
        border-radius: 12px;
        background: rgba(9, 14, 26, 0.58);
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .budget-item.pass {
        border-color: rgba(52, 211, 153, 0.24);
      }

      .budget-item.warn {
        border-color: rgba(251, 191, 36, 0.4);
      }

      .budget-item.fail {
        border-color: rgba(251, 113, 133, 0.45);
      }

      .budget-label {
        font-size: 11px;
        color: var(--muted);
      }

      .budget-val {
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
      }

      .budget-limit {
        font-size: 10px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .diag-list {
        margin: 12px 0 0;
        padding-left: 16px;
        font-size: 11.5px;
        line-height: 1.5;
      }

      .diag-list.fail {
        color: var(--danger);
      }

      .diag-list.warn {
        color: #fbbf24;
      }

      .field-stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 12px;
      }

      .field-label {
        font-size: 11px;
        color: var(--muted);
      }

      .field-label strong {
        color: var(--text);
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: var(--text);
        cursor: pointer;
      }

      .studio-input {
        width: 100%;
        padding: 7px 10px;
        font: inherit;
        font-size: 12px;
        color: var(--text);
        background: rgba(9, 14, 26, 0.72);
        border: 1px solid var(--border);
        border-radius: 9px;
        outline: none;
      }

      .studio-input:focus {
        border-color: var(--accent);
      }

      .studio-input.compact {
        padding: 5px 8px;
        font-size: 11.5px;
      }

      .studio-input.is-invalid {
        border-color: var(--danger);
      }

      .clip-map-list {
        display: flex;
        flex-direction: column;
        gap: 7px;
        max-height: 280px;
        overflow-y: auto;
        padding-right: 2px;
      }

      .clip-map-row {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
      }

      .clip-state-btn {
        border: 1px solid var(--border);
        background: rgba(9, 14, 26, 0.6);
        color: var(--text);
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        padding: 5px 7px;
        border-radius: 8px;
        text-align: left;
        cursor: pointer;
      }

      .clip-state-btn:hover {
        border-color: var(--accent);
      }

      .camera-readout {
        padding: 10px;
        border-radius: 10px;
        background: rgba(9, 14, 26, 0.55);
        border: 1px solid var(--border);
        font-size: 11px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .camera-readout code {
        color: var(--accent);
      }

      .reset-btn.compact {
        margin-top: 6px;
        padding: 6px 10px;
      }

      .export-actions {
        display: inline-flex;
        gap: 6px;
      }

      .mini-btn {
        border: 1px solid var(--border);
        background: rgba(9, 14, 26, 0.7);
        color: var(--text);
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 8px;
        cursor: pointer;
      }

      .mini-btn.primary {
        border: 0;
        color: #06121c;
        background: linear-gradient(135deg, var(--accent), #7dd3fc);
      }

      .json-preview {
        margin: 0;
        padding: 10px;
        max-height: 220px;
        overflow: auto;
        border-radius: 10px;
        background: rgba(5, 8, 15, 0.85);
        border: 1px solid var(--border);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10.5px;
        line-height: 1.45;
        color: #cbd5e1;
      }

      /* ---------- WebXR ---------- */
      .chip-xr {
        border-color: rgba(76, 201, 240, 0.4);
        color: var(--accent);
      }

      .xr-controls {
        position: absolute;
        right: 18px;
        bottom: 18px;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }

      .xr-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 13px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        background: rgba(9, 14, 26, 0.72);
        border: 1px solid var(--border);
        border-radius: 999px;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: color 0.16s ease, border-color 0.16s ease, background 0.16s ease,
          box-shadow 0.16s ease, transform 0.16s ease;
      }

      .xr-btn:hover:not(:disabled) {
        color: #fff;
        border-color: var(--border-strong);
        transform: translateY(-1px);
      }

      .xr-btn.active {
        color: #06121c;
        background: linear-gradient(135deg, var(--accent), #7dd3fc);
        border-color: transparent;
        box-shadow: 0 8px 22px rgba(76, 201, 240, 0.28);
      }

      .xr-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .xr-btn:focus-visible {
        outline: 2px solid var(--accent-2);
        outline-offset: 2px;
      }

      .xr-badge {
        padding: 4px 10px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        background: rgba(76, 201, 240, 0.12);
        border: 1px solid rgba(76, 201, 240, 0.35);
        border-radius: 999px;
      }

      .xr-error {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        max-width: 260px;
        padding: 8px 10px;
        font-size: 11px;
        line-height: 1.45;
        color: var(--danger);
        background: rgba(251, 113, 133, 0.12);
        border: 1px solid rgba(251, 113, 133, 0.4);
        border-radius: 10px;
        backdrop-filter: blur(10px);
      }

      .xr-error-dismiss {
        padding: 0;
        font: inherit;
        font-size: 14px;
        line-height: 1;
        color: inherit;
        background: transparent;
        border: 0;
        cursor: pointer;
      }

      .xr-dom-overlay {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 16px;
        pointer-events: none;
      }

      .xr-dom-overlay[hidden] {
        display: none;
      }

      .xr-overlay-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        max-width: min(760px, 100%);
        padding: 10px 12px;
        pointer-events: auto;
        background: rgba(7, 11, 20, 0.84);
        border: 1px solid var(--border-strong);
        border-radius: 16px;
        backdrop-filter: blur(14px);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
      }

      .xr-overlay-hint {
        flex: 1 1 150px;
        font-size: 11px;
        line-height: 1.4;
        color: var(--muted);
      }

      .xr-overlay-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
